[package]
name = "leash-policy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Leash: on-chain spending firewall for AI agents on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
